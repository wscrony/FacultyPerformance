[project]
name = "faculty-performance"
version = "0.1.0"
description = "Korean CS faculty & candidate publication analytics (local only)"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4", "requests>=2.31", "typer>=0.12", "rich>=13"]

[project.optional-dependencies]
app = ["streamlit>=1.38", "plotly>=5"]
dev = ["pytest>=8"]

[project.scripts]
fp = "fp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
